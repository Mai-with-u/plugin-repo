name: Mai Review Plugin Issue
run-name: "Mai Review Issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  mai-review:
    if: >-
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.actor != 'github-actions[bot]' &&
       github.event.label.name == 'validated' &&
       (contains(github.event.issue.labels.*.name, 'plugin-submission') ||
        contains(github.event.issue.labels.*.name, 'plugin-modification') ||
        contains(github.event.issue.labels.*.name, 'plugin-removal'))) ||
      (github.event_name == 'issue_comment' &&
       (contains(github.event.issue.labels.*.name, 'plugin-submission') ||
        contains(github.event.issue.labels.*.name, 'plugin-modification') ||
        contains(github.event.issue.labels.*.name, 'plugin-removal')) &&
       contains(github.event.issue.labels.*.name, 'validated') &&
       contains(github.event.comment.body, '/mai_review'))
    runs-on: ubuntu-latest
    concurrency:
      group: mai-review-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      ANTHROPIC_BASE_URL: https://api.stepfun.com/step_plan
      ANTHROPIC_MODEL: step-5-preview
      ANTHROPIC_DEFAULT_SONNET_MODEL: step-5-preview
      ANTHROPIC_DEFAULT_OPUS_MODEL: step-5-preview
      ANTHROPIC_DEFAULT_HAIKU_MODEL: step-5-preview
      ANTHROPIC_DEFAULT_FABLE_MODEL: step-5-preview
      CLAUDE_CODE_SUBAGENT_MODEL: step-5-preview
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Create Mai GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAI_REVIEW_APP_ID }}
          private-key: ${{ secrets.MAI_REVIEW_APP_PRIVATE_KEY }}

      - name: Check reviewer permission
        id: check-permission
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const commenter = context.payload.comment.user.login;
            const command = context.payload.comment.body.trim();

            if (command !== '/mai_review') {
              core.setFailed('评论不是独立的 /mai_review 命令');
              return;
            }

            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter,
            });

            const allowedPermissions = ['admin', 'write'];
            if (!allowedPermissions.includes(permission.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ @${commenter} 只有 **仓库维护者** (admin/write) 可以使用 \`/mai_review\` 命令。`,
              });
              core.setFailed(`用户 @${commenter} 没有权限使用 /mai_review`);
              return;
            }

            core.setOutput('commenter', commenter);

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Reserve review and announce start
        id: review-start
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { countReviews, MAX_REVIEWS } = require('./.github/scripts/mai_review_state.js');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const count = countReviews(comments);
            if (count >= MAX_REVIEWS) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `该 Issue 已达到审核次数上限，无法再次发起审核。\n\n已审核：${count}次 / ${MAX_REVIEWS}次`,
              });
              core.setOutput('should_run', 'false');
              return;
            }
            const reviewCount = count + 1;
            const reviewRun = `${context.runId}:${process.env.GITHUB_RUN_ATTEMPT}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `<!-- codex-mai-review-start: ${reviewRun} -->\n🔄 已开始审核，正在检查当前插件版本，请等待审核结果。\n\n已审核：${reviewCount}次 / ${MAX_REVIEWS}次`,
            });
            core.setOutput('review_count', reviewCount);
            core.setOutput('review_run', reviewRun);
            core.setOutput('should_run', 'true');

      - name: Setup Node.js
        if: steps.review-start.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Step API credentials
        if: steps.review-start.outputs.should_run == 'true'
        env:
          STEP_API_KEY: ${{ secrets.STEP_API_KEY }}
        run: |
          if [ -z "$STEP_API_KEY" ]; then
            echo "缺少 STEP_API_KEY secret" >&2
            exit 1
          fi

      - name: Build review context
        if: steps.review-start.outputs.should_run == 'true'
        id: build-context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/build_mai_review_context.js

      - name: Checkout plugin under review
        if: steps.review-start.outputs.should_run == 'true' && steps.build-context.outputs.plugin_repo != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.build-context.outputs.plugin_repo }}
          ref: ${{ steps.build-context.outputs.latest_commit }}
          path: plugin-under-review
          persist-credentials: false

      - name: Install Claude Code CLI
        if: steps.review-start.outputs.should_run == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.283
          claude --bare --restricted --version

      - name: Run StepFun review
        if: steps.review-start.outputs.should_run == 'true'
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.STEP_API_KEY }}
        run: |
          set -euo pipefail
          PROMPT="$(cat .github/codex/prompts/plugin-issue-review.md)"
          claude --bare --restricted -p "$PROMPT" \
            --model "$ANTHROPIC_MODEL" \
            --effort high \
            --tools "Read,Glob,Grep,WebFetch" \
            --allowedTools "Read" "Glob" "Grep" "WebFetch" \
            --permission-mode dontAsk \
            --output-format json | jq -er 'select(.is_error == false and (.result | type == "string") and (.result | length > 0)) | .result' > codex-review.md
          test -s codex-review.md

      - name: Run StepFun Mai comment
        if: steps.review-start.outputs.should_run == 'true'
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.STEP_API_KEY }}
        run: |
          set -euo pipefail
          PROMPT="$(cat .github/codex/prompts/plugin-issue-maimai-comment.md)"
          claude --bare --restricted -p "$PROMPT" \
            --model "$ANTHROPIC_MODEL" \
            --effort medium \
            --tools "Read,Glob,Grep" \
            --allowedTools "Read" "Glob" "Grep" \
            --permission-mode dontAsk \
            --output-format json | jq -er 'select(.is_error == false and (.result | type == "string") and (.result | length > 0)) | .result' > codex-maimai.md
          test -s codex-maimai.md

      # Refresh the App token before posting results, including failed reviews.
      # Long reviews may outlive the token used for the start notification.
      - name: Refresh Mai GitHub App token for result
        if: always() && steps.review-start.outputs.should_run == 'true'
        id: result-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAI_REVIEW_APP_ID }}
          private-key: ${{ secrets.MAI_REVIEW_APP_PRIVATE_KEY }}

      - name: Post review comment
        if: steps.review-start.outputs.should_run == 'true' && success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.result-app-token.outputs.token || steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const sanitize = (text) =>
              text
                .replace(/\/approve\b/gi, '"approve"')
                .replace(/\/recheck\b/gi, '"recheck"')
                .replace(/\/mai_review\b/gi, '"mai_review"')
                .replace(/\/reject\b/gi, '"reject"');

            const review = sanitize(fs.readFileSync('codex-review.md', 'utf8').trim());
            const maimai = sanitize(fs.readFileSync('codex-maimai.md', 'utf8').trim());
            if (!review) {
              core.setFailed('codex-review.md 为空，无法发表评论');
              return;
            }
            if (!maimai) {
              core.setFailed('codex-maimai.md 为空，无法发表评论');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- codex-mai-review -->\n<!-- codex-mai-review-run: ${{ steps.review-start.outputs.review_run }} -->\n<!-- codex-mai-review-commit: ${{ steps.build-context.outputs.latest_commit }} -->\n${review}\n${maimai}\n\n已审核：${{ steps.review-start.outputs.review_count }}次 / 8次`,
            });

      - name: Post review failure
        if: always() && steps.review-start.outputs.should_run == 'true' && (failure() || cancelled())
        uses: actions/github-script@v7
        env:
          REVIEW_COUNT: ${{ steps.review-start.outputs.review_count }}
          REVIEW_RUN: ${{ steps.review-start.outputs.review_run }}
        with:
          github-token: ${{ steps.result-app-token.outputs.token || steps.app-token.outputs.token }}
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `<!-- codex-mai-review-failed: ${process.env.REVIEW_RUN} -->\n❌ 本次审核失败或被中止，未能完成审核。请维护者查看[运行日志](${runUrl})排查，修复后可重新请求审核。\n\n已审核：${process.env.REVIEW_COUNT}次 / 8次`,
            });
