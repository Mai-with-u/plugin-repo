name: Mai Review Plugin Registration
run-name: "Mai Registration Review #${{ github.event.issue.number }}"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  mai-review:
    if: >-
      !contains(github.event.issue.labels.*.name, 'plugin-release') &&
      ((github.event_name == 'issues' &&
        github.actor != 'github-actions[bot]' &&
        github.event.label.name == 'validated' &&
        (contains(github.event.issue.labels.*.name, 'plugin-submission') ||
         contains(github.event.issue.labels.*.name, 'plugin-modification') ||
         contains(github.event.issue.labels.*.name, 'plugin-removal'))) ||
       (github.event_name == 'issue_comment' &&
        (contains(github.event.issue.labels.*.name, 'plugin-submission') ||
         contains(github.event.issue.labels.*.name, 'plugin-modification') ||
         contains(github.event.issue.labels.*.name, 'plugin-removal')) &&
        contains(github.event.issue.labels.*.name, 'validated') &&
        contains(github.event.comment.body, '/mai_review')))
    uses: ./.github/workflows/mai-review-run.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      review_prompt: .github/codex/prompts/plugin-issue-review.md
      maimai_prompt: .github/codex/prompts/plugin-issue-maimai-comment.md
    secrets: inherit
