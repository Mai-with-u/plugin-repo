name: Mai Review Plugin Issue
run-name: "Mai Review Issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  mai-review:
    if: >-
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.actor != 'github-actions[bot]' &&
       github.event.label.name == 'validated' &&
       (contains(github.event.issue.labels.*.name, 'plugin-submission') ||
        contains(github.event.issue.labels.*.name, 'plugin-modification') ||
        contains(github.event.issue.labels.*.name, 'plugin-removal'))) ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.issue.labels.*.name, 'plugin-submission') &&
       contains(github.event.issue.labels.*.name, 'validated') &&
       contains(github.event.comment.body, '/mai_review'))
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_BASE_URL: https://api.stepfun.com/step_plan
      ANTHROPIC_MODEL: step-5-preview
      ANTHROPIC_DEFAULT_SONNET_MODEL: step-5-preview
      ANTHROPIC_DEFAULT_OPUS_MODEL: step-5-preview
      ANTHROPIC_DEFAULT_HAIKU_MODEL: step-5-preview
      ANTHROPIC_DEFAULT_FABLE_MODEL: step-5-preview
      CLAUDE_CODE_SUBAGENT_MODEL: step-5-preview
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check reviewer permission
        id: check-permission
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const command = context.payload.comment.body.trim();

            if (command !== '/mai_review') {
              core.setFailed('评论不是独立的 /mai_review 命令');
              return;
            }

            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter,
            });

            const allowedPermissions = ['admin', 'write'];
            if (!allowedPermissions.includes(permission.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ @${commenter} 只有 **仓库维护者** (admin/write) 可以使用 \`/mai_review\` 命令。`,
              });
              core.setFailed(`用户 @${commenter} 没有权限使用 /mai_review`);
              return;
            }

            core.setOutput('commenter', commenter);

      - name: Check for active review
        id: active-review
        uses: actions/github-script@v7
        with:
          script: |
            const expectedTitle = `Mai Review Issue #${context.issue.number}`;
            const activeRuns = [];

            for (const status of ['queued', 'in_progress']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'mai-review.yml',
                status,
                per_page: 100,
              });
              activeRuns.push(...runs);
            }

            const firstRun = activeRuns
              .filter(run => run.display_title === expectedTitle)
              .sort((a, b) => Number(a.id) - Number(b.id))[0];
            const duplicate = firstRun && Number(firstRun.id) !== Number(context.runId);

            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '正在审核中，请不要重复请求。',
              });
              core.setOutput('should_run', 'false');
              return;
            }

            core.setOutput('should_run', 'true');

      - name: Checkout repository
        if: steps.active-review.outputs.should_run == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.active-review.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Step API credentials
        if: steps.active-review.outputs.should_run == 'true'
        env:
          STEP_API_KEY: ${{ secrets.STEP_API_KEY }}
        run: |
          if [ -z "$STEP_API_KEY" ]; then
            echo "缺少 STEP_API_KEY secret" >&2
            exit 1
          fi

      - name: Validate GitHub App credentials
        if: steps.active-review.outputs.should_run == 'true'
        env:
          MAI_REVIEW_APP_ID: ${{ secrets.MAI_REVIEW_APP_ID }}
          MAI_REVIEW_APP_PRIVATE_KEY: ${{ secrets.MAI_REVIEW_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$MAI_REVIEW_APP_ID" ]; then
            echo "缺少 MAI_REVIEW_APP_ID secret" >&2
            exit 1
          fi

          if [ -z "$MAI_REVIEW_APP_PRIVATE_KEY" ]; then
            echo "缺少 MAI_REVIEW_APP_PRIVATE_KEY secret" >&2
            exit 1
          fi

      - name: Build review context
        if: steps.active-review.outputs.should_run == 'true'
        id: build-context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FORCE_REVIEW: ${{ github.event_name == 'issue_comment' }}
        run: node .github/scripts/build_mai_review_context.js

      - name: Skip duplicate or throttled review
        if: steps.active-review.outputs.should_run == 'true' && steps.build-context.outputs.should_review != 'true'
        run: echo "${{ steps.build-context.outputs.skip_reason }}"

      - name: Checkout plugin under review
        if: steps.active-review.outputs.should_run == 'true' && steps.build-context.outputs.should_review == 'true' && steps.build-context.outputs.plugin_repo != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.build-context.outputs.plugin_repo }}
          ref: ${{ steps.build-context.outputs.latest_commit }}
          path: plugin-under-review
          persist-credentials: false

      - name: Install Claude Code CLI
        if: steps.active-review.outputs.should_run == 'true' && steps.build-context.outputs.should_review == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run StepFun review
        if: steps.active-review.outputs.should_run == 'true' && steps.build-context.outputs.should_review == 'true'
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.STEP_API_KEY }}
        run: |
          set -euo pipefail
          PROMPT="$(cat .github/codex/prompts/plugin-issue-review.md)"
          claude --bare --restricted -p "$PROMPT" \
            --model "$ANTHROPIC_MODEL" \
            --effort high \
            --tools "Read,Glob,Grep,WebFetch" \
            --allowedTools "Read" "Glob" "Grep" "WebFetch" \
            --permission-mode dontAsk \
            --output-format json | jq -er 'select(.is_error == false and (.result | type == "string") and (.result | length > 0)) | .result' > codex-review.md
          test -s codex-review.md

      - name: Run StepFun Mai comment
        if: steps.active-review.outputs.should_run == 'true' && steps.build-context.outputs.should_review == 'true'
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.STEP_API_KEY }}
        run: |
          set -euo pipefail
          PROMPT="$(cat .github/codex/prompts/plugin-issue-maimai-comment.md)"
          claude --bare --restricted -p "$PROMPT" \
            --model "$ANTHROPIC_MODEL" \
            --effort medium \
            --tools "Read,Glob,Grep" \
            --allowedTools "Read" "Glob" "Grep" \
            --permission-mode dontAsk \
            --output-format json | jq -er 'select(.is_error == false and (.result | type == "string") and (.result | length > 0)) | .result' > codex-maimai.md
          test -s codex-maimai.md

      - name: Create GitHub App token
        if: steps.active-review.outputs.should_run == 'true' && steps.build-context.outputs.should_review == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAI_REVIEW_APP_ID }}
          private-key: ${{ secrets.MAI_REVIEW_APP_PRIVATE_KEY }}

      - name: Post review comment
        if: steps.active-review.outputs.should_run == 'true' && steps.build-context.outputs.should_review == 'true' && success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const sanitize = (text) =>
              text
                .replace(/\/approve\b/gi, '"approve"')
                .replace(/\/recheck\b/gi, '"recheck"')
                .replace(/\/reject\b/gi, '"reject"');

            const review = sanitize(fs.readFileSync('codex-review.md', 'utf8').trim());
            const maimai = sanitize(fs.readFileSync('codex-maimai.md', 'utf8').trim());
            if (!review) {
              core.setFailed('codex-review.md 为空，无法发表评论');
              return;
            }
            if (!maimai) {
              core.setFailed('codex-maimai.md 为空，无法发表评论');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- codex-mai-review -->\n<!-- codex-mai-review-commit: ${{ steps.build-context.outputs.latest_commit }} -->\n${review}\n${maimai}`,
            });
