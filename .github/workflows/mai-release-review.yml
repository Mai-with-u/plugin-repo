name: Mai Review Plugin Release
run-name: "Mai Release Review #${{ github.event.issue.number }}"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  mai-review:
    if: >-
      contains(github.event.issue.labels.*.name, 'plugin-release') &&
      ((github.event_name == 'issues' &&
        github.actor != 'github-actions[bot]' &&
        github.event.label.name == 'validated') ||
       (github.event_name == 'issue_comment' &&
        contains(github.event.issue.labels.*.name, 'validated') &&
        contains(github.event.comment.body, '/mai_review')))
    uses: ./.github/workflows/mai-review-run.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      review_prompt: .github/codex/prompts/plugin-release-review.md
      maimai_prompt: .github/codex/prompts/plugin-release-maimai-comment.md
      structured_release_review: true
    secrets: inherit

  auto-approve:
    needs: mai-review
    if: needs.mai-review.outputs.review_ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-repo-main-write
      cancel-in-progress: false
    steps:
      - name: Checkout current index
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download structured review
        uses: actions/download-artifact@v4
        with:
          name: release-review-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-review-result

      - name: Create Mai GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAI_REVIEW_APP_ID }}
          private-key: ${{ secrets.MAI_REVIEW_APP_PRIVATE_KEY }}

      - name: Apply safe release decisions
        uses: actions/github-script@v7
        env:
          MAI_REVIEW_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs');
            const { applyReleaseReview } = require('./.github/scripts/apply_release_review.cjs');
            const { createGithubClient } = require('./.github/scripts/sync_plugin_versions.cjs');
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: context.issue.number });
            const result = JSON.parse(fs.readFileSync('release-review-result/release-review.json', 'utf8'));
            const targets = JSON.parse(fs.readFileSync('release-review-result/mai-release-targets.json', 'utf8'));
            const outcome = await applyReleaseReview({ root: process.cwd(), issue, result, targets,
              request: createGithubClient(process.env.GITHUB_TOKEN), botLogin: process.env.MAI_REVIEW_BOT_LOGIN });
            fs.writeFileSync('release-review-outcome.json', JSON.stringify(outcome));

      - name: Publish automatically approved versions
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add plugin_versions.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: 自动收录审核通过的插件版本"
            git push origin HEAD:main
          fi

      - name: Report automatic approval
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const outcome = JSON.parse(fs.readFileSync('release-review-outcome.json', 'utf8'));
            const params = { ...context.repo, issue_number: context.issue.number };
            if (outcome.manual.length) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: 'needs-manual-review' });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name: 'needs-manual-review', color: 'fbca04', description: '发布版本需要维护者处理' });
              }
              await github.rest.issues.addLabels({ ...params, labels: ['needs-manual-review'] });
            } else {
              await github.rest.issues.addLabels({ ...params, labels: ['approved'] });
              const { data: issue } = await github.rest.issues.get(params);
              if (issue.labels.some(label => label.name === 'needs-manual-review')) {
                await github.rest.issues.removeLabel({ ...params, name: 'needs-manual-review' });
              }
            }
            await github.rest.issues.createComment({ ...params, body:
              (outcome.passed.length ? `✅ 已自动收录：${outcome.passed.map(item => item.version).join('、')}。\n\n` : '') +
              (outcome.manual.length ? `⚠️ 需人工处理：${outcome.manual.join('、')}。请维护者核实风险后决定是否批准。` : '✅ 本批次全部通过，已完成自动收录。') });
            if (!outcome.manual.length) await github.rest.issues.update({ ...params, state: 'closed' });

      - name: Report automatic approval failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: `⚠️ 自动收录未完成，Issue 保留给维护者处理。请查看[运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})。` });
