name: Approve or Reject Plugin

on:
  issue_comment:
    types: [created]

jobs:
  approve-release:
    if: >-
      contains(github.event.issue.labels.*.name, 'plugin-release') &&
      contains(github.event.issue.labels.*.name, 'validated') &&
      (github.event.comment.body == '/approve' || github.event.comment.body == '/ap' ||
       startsWith(github.event.comment.body, '/approve ') || startsWith(github.event.comment.body, '/ap '))
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-repo-main-write
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check release maintainer permission
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.payload.comment.user.login,
            });
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed('只有仓库维护者可以批准发布版本');
            }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create Mai GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAI_REVIEW_APP_ID }}
          private-key: ${{ secrets.MAI_REVIEW_APP_PRIVATE_KEY }}

      - name: Approve release version
        uses: actions/github-script@v7
        env:
          MAI_REVIEW_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs');
            const { approveReleaseCommand } = require('./.github/scripts/release_commands.cjs');
            const { createGithubClient } = require('./.github/scripts/sync_plugin_versions.cjs');
            const { data: issue } = await github.rest.issues.get({
              ...context.repo, issue_number: context.issue.number,
            });
            const outcome = await approveReleaseCommand({ root: process.cwd(), issue, command: context.payload.comment.body,
              request: createGithubClient(process.env.GITHUB_TOKEN),
              botLogin: process.env.MAI_REVIEW_BOT_LOGIN });
            fs.writeFileSync('release-command-outcome.json', JSON.stringify(outcome));

      - name: Publish approved version index
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add plugin_versions.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: 收录已批准的插件发布版本"
            git push origin HEAD:main
          fi

      - name: Close approved release issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outcome = JSON.parse(fs.readFileSync('release-command-outcome.json', 'utf8'));
            const params = { ...context.repo, issue_number: context.issue.number };
            await github.rest.issues.createComment({ ...params, body: `✅ 已批准并收录：${outcome.approved.join('、')}。` +
              (outcome.pending.length ? `\n\n⏳ 待处理：${outcome.pending.join('、')}。` : '') });
            if (!outcome.pending.length) {
              await github.rest.issues.addLabels({ ...params, labels: ['approved'] });
              try { await github.rest.issues.removeLabel({ ...params, name: 'needs-manual-review' }); }
              catch (error) { if (error.status !== 404) throw error; }
              await github.rest.issues.update({ ...params, state: 'closed' });
            }

      - name: Report release approval failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: `❌ 发布批准未完成，请检查[工作流日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})后重试。` });

  approve:
    if: >-
      !contains(github.event.issue.labels.*.name, 'plugin-release') &&
      (contains(github.event.issue.labels.*.name, 'plugin-submission') ||
       contains(github.event.issue.labels.*.name, 'plugin-modification') ||
       contains(github.event.issue.labels.*.name, 'plugin-removal')) &&
      contains(github.event.issue.labels.*.name, 'validated') &&
      (github.event.comment.body == '/approve' || github.event.comment.body == '/ap')
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-repo-main-write
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Check maintainer permission
        id: check-permission
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter
            });
            
            const allowedPermissions = ['admin', 'write'];
            if (!allowedPermissions.includes(permission.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ @${commenter} 只有 **仓库维护者** (admin/write) 可以使用 \`/approve\` 或 \`/ap\` 命令。`
              });
              core.setFailed(`用户 @${commenter} 没有权限批准插件`);
              return;
            }
            
            console.log(`✅ @${commenter} (${permission.permission}) 执行 ${context.payload.comment.body.trim()}`);
            core.setOutput('approved_by', commenter);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Parse issue and add plugin
        id: add-plugin
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const labels = context.payload.issue.labels.map(label => label.name);
            const requestType = labels.includes('plugin-modification')
              ? 'modify'
              : labels.includes('plugin-removal')
                ? 'remove'
                : 'add';
            
            const body = context.payload.issue.body;
            const optionalValue = match => {
              const value = match?.[1]?.trim();
              return !value || value === '_No response_' || value.startsWith('### ') ? '' : value;
            };
            const pluginIdMatch = body.match(/### 插件 ID \/ Plugin ID\s*\n\s*\n(.+)/);
            const currentPluginIdMatch = body.match(/### 当前插件 ID \/ Current Plugin ID\s*\n\s*\n(.+)/);
            const newPluginIdMatch = body.match(/### 新插件 ID \/ New Plugin ID\s*\n\s*\n(.+)/);
            const addRepoUrlMatch = body.match(/### 仓库地址 \/ Repository URL\s*\n\s*\n(.+)/);
            const modifyRepoUrlMatch = body.match(/### 新的仓库地址(?:（可选）)? \/ New Repository URL(?: \(Optional\))?\s*\n\s*\n(.+)/);
            
            if (requestType === 'modify') {
              if (!currentPluginIdMatch) {
                core.setFailed('无法解析 Issue 内容：缺少当前插件 ID');
                return;
              }
            } else if (!pluginIdMatch) {
              core.setFailed('无法解析 Issue 内容：缺少插件 ID');
              return;
            }
            
            const pluginId = requestType === 'modify'
              ? (optionalValue(newPluginIdMatch) || currentPluginIdMatch[1].trim())
              : pluginIdMatch[1].trim();
            const currentPluginId = requestType === 'modify'
              ? currentPluginIdMatch[1].trim()
              : pluginId;
            const repoUrl = requestType === 'modify'
              ? optionalValue(modifyRepoUrlMatch)
              : addRepoUrlMatch && addRepoUrlMatch[1].trim();
            
            const plugins = JSON.parse(fs.readFileSync('plugins.json', 'utf8'));
            const existingPluginIndex = requestType === 'modify'
              ? plugins.findIndex(p => p.id === currentPluginId)
              : plugins.findIndex(p => p.id === pluginId);
            
            if (requestType === 'add') {
              if (plugins.some(p => [p.id, ...(p.aliases || [])].some(id => id.toLowerCase() === pluginId.toLowerCase()))) {
                core.setFailed(`插件 ID 已存在: ${pluginId}`);
                return;
              }
              if (plugins.some(p => p.repositoryUrl === repoUrl)) {
                core.setFailed(`仓库 URL 已存在: ${repoUrl}`);
                return;
              }
              if (!repoUrl) {
                core.setFailed('无法解析 Issue 内容：缺少仓库地址');
                return;
              }
              
              plugins.push({
                id: pluginId,
                repositoryUrl: repoUrl
              });
            }
            
            if (requestType === 'modify') {
              const { migratePlugin } = require('./.github/scripts/migrate_plugin.cjs');
              await migratePlugin({ root: process.cwd(), currentPluginId, pluginId, repoUrl,
                request: async resource => (await github.request('GET ' + resource)).data });
            }

            if (requestType === 'remove') {
              if (existingPluginIndex === -1) {
                core.setFailed(`插件 ID 不存在: ${pluginId}`);
                return;
              }
              plugins.splice(existingPluginIndex, 1);
            }
            
            if (requestType !== 'modify') fs.writeFileSync('plugins.json', JSON.stringify(plugins, null, 2) + '\n');
            
            core.setOutput('plugin_id', pluginId);
            if (requestType === 'modify') {
              core.setOutput('current_plugin_id', currentPluginId);
            }
            core.setOutput('repo_url', repoUrl || '');
            core.setOutput('request_type', requestType);

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add plugins.json plugin_versions.json plugin_details.json blocked_release_versions.json
          if [ "${{ steps.add-plugin.outputs.request_type }}" = "modify" ]; then
            commit_message="chore: Update ${{ steps.add-plugin.outputs.plugin_id }} plugin (via #${{ github.event.issue.number }})"
          elif [ "${{ steps.add-plugin.outputs.request_type }}" = "remove" ]; then
            commit_message="chore: Remove ${{ steps.add-plugin.outputs.plugin_id }} plugin (via #${{ github.event.issue.number }})"
          else
            commit_message="feat: Add ${{ steps.add-plugin.outputs.plugin_id }} plugin (via #${{ github.event.issue.number }})"
          fi
          git commit -m "$commit_message"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "无法推送到 main，已重试 $attempt 次" >&2
              exit 1
            fi

            echo "推送失败，正在基于最新 main 重新应用当前操作（第 $((attempt + 1)) 次）"
            git fetch origin main
            git reset --hard origin/main
            REQUEST_TYPE="${{ steps.add-plugin.outputs.request_type }}" \
            PLUGIN_ID="${{ steps.add-plugin.outputs.plugin_id }}" \
            CURRENT_PLUGIN_ID="${{ steps.add-plugin.outputs.current_plugin_id }}" \
            REPO_URL="${{ steps.add-plugin.outputs.repo_url }}" \
            node <<'EOL'
          (async () => {
          const fs = require('fs');
          const requestType = process.env.REQUEST_TYPE;
          const pluginId = process.env.PLUGIN_ID;
          const currentPluginId = process.env.CURRENT_PLUGIN_ID || pluginId;
          const repoUrl = process.env.REPO_URL || '';
          const plugins = JSON.parse(fs.readFileSync('plugins.json', 'utf8'));
          const existingPluginIndex = requestType === 'modify'
            ? plugins.findIndex(plugin => plugin.id === currentPluginId)
            : plugins.findIndex(plugin => plugin.id === pluginId);

          if (requestType === 'add') {
            if (plugins.some(plugin => [plugin.id, ...(plugin.aliases || [])].some(id => id.toLowerCase() === pluginId.toLowerCase()))) {
              throw new Error(`插件 ID 已存在: ${pluginId}`);
            }
            if (!repoUrl) {
              throw new Error('无法解析 Issue 内容：缺少仓库地址');
            }
            if (plugins.some(plugin => plugin.repositoryUrl === repoUrl)) {
              throw new Error(`仓库 URL 已存在: ${repoUrl}`);
            }
            plugins.push({ id: pluginId, repositoryUrl: repoUrl });
          } else if (requestType === 'modify') {
            const { migratePlugin } = require('./.github/scripts/migrate_plugin.cjs');
            const { createGithubClient } = require('./.github/scripts/sync_plugin_versions.cjs');
            await migratePlugin({ root: process.cwd(), currentPluginId, pluginId, repoUrl,
              request: createGithubClient() });
          } else if (requestType === 'remove') {
            if (existingPluginIndex === -1) {
              throw new Error(`插件 ID 不存在: ${pluginId}`);
            }
            plugins.splice(existingPluginIndex, 1);
          } else {
            throw new Error(`未知操作类型: ${requestType}`);
          }

          if (requestType !== 'modify') fs.writeFileSync('plugins.json', JSON.stringify(plugins, null, 2) + '\n');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          EOL
            node -e "JSON.parse(require('fs').readFileSync('plugins.json', 'utf8'))"
            git add plugins.json plugin_versions.json plugin_details.json blocked_release_versions.json
            git commit -m "$commit_message"
          done

      - name: Close issue with success
        uses: actions/github-script@v7
        with:
          script: |
            const pluginId = '${{ steps.add-plugin.outputs.plugin_id }}';
            const approvedBy = '${{ steps.check-permission.outputs.approved_by }}';
            const requestType = '${{ steps.add-plugin.outputs.request_type }}';
            
            const titleMap = {
              add: '插件已添加 / Plugin Added',
              modify: '插件已更新 / Plugin Updated',
              remove: '插件已移除 / Plugin Removed'
            };
            const actionMap = {
              add: '已成功添加到插件中心',
              modify: '已成功更新仓库信息',
              remove: '已从插件中心移除'
            };
            const title = titleMap[requestType] || titleMap.add;
            const actionText = actionMap[requestType] || actionMap.add;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🎉 ${title}\n\n插件 \`${pluginId}\` ${actionText}！\n\n| 信息 | 值 |\n|------|----|\n| 批准人 | @${approvedBy} |\n| 关联 Issue | #${context.issue.number} |\n\n插件详情将在下次自动更新后显示在 [插件展示页](https://plugins.maibot.chat/)\n\n感谢您的贡献！ / Thank you for your contribution!`
            });
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['approved']
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Handle approve failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ 添加失败 / Addition Failed\n\n插件添加过程中发生错误。\n\n请检查 [工作流日志](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 获取详细信息。`
            });

  reject-release:
    if: >-
      contains(github.event.issue.labels.*.name, 'plugin-release') &&
      (github.event.comment.body == '/reject' || startsWith(github.event.comment.body, '/reject '))
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-repo-main-write
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check release maintainer permission
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.payload.comment.user.login });
            if (!['admin', 'write'].includes(data.permission)) core.setFailed('只有仓库维护者可以拒绝发布版本');

      - name: Checkout current index
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create Mai GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAI_REVIEW_APP_ID }}
          private-key: ${{ secrets.MAI_REVIEW_APP_PRIVATE_KEY }}

      - name: Block rejected versions
        uses: actions/github-script@v7
        env:
          MAI_REVIEW_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          script: |
            const fs = require('fs');
            const { rejectReleaseCommand } = require('./.github/scripts/release_commands.cjs');
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: context.issue.number });
            const outcome = rejectReleaseCommand({ root: process.cwd(), issue, botLogin: process.env.MAI_REVIEW_BOT_LOGIN });
            fs.writeFileSync('release-command-outcome.json', JSON.stringify(outcome));

      - name: Publish rejected versions
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add blocked_release_versions.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: 永久拒绝插件发布版本"
            git push origin HEAD:main
          fi

      - name: Close rejected release issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const outcome = JSON.parse(fs.readFileSync('release-command-outcome.json', 'utf8'));
            const params = { ...context.repo, issue_number: context.issue.number };
            const reason = context.payload.comment.body.slice('/reject'.length).trim() || '未提供具体原因';
            await github.rest.issues.addLabels({ ...params, labels: ['rejected'] });
            await github.rest.issues.createComment({ ...params, body:
              `🚫 永久拒绝：${outcome.rejected.join('、') || '无待审版本'}。\n\n原因：${reason}` +
              (outcome.approved.length ? `\n\n已收录版本保留：${outcome.approved.join('、')}。` : '') });
            for (const name of ['validated', 'needs-manual-review']) {
              try { await github.rest.issues.removeLabel({ ...params, name }); }
              catch (error) { if (error.status !== 404) throw error; }
            }
            await github.rest.issues.update({ ...params, state: 'closed' });

      - name: Report release rejection failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: `❌ 发布拒绝未完成，请检查[运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})后重试。` });

  reject:
    if: >-
      (contains(github.event.issue.labels.*.name, 'plugin-submission') ||
       contains(github.event.issue.labels.*.name, 'plugin-modification') ||
       contains(github.event.issue.labels.*.name, 'plugin-removal')) &&
      !contains(github.event.issue.labels.*.name, 'plugin-release') &&
      startsWith(github.event.comment.body, '/reject')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - name: Check maintainer permission and reject
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const commentBody = context.payload.comment.body;
            
            // 检查权限
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter
            });
            
            const allowedPermissions = ['admin', 'write'];
            if (!allowedPermissions.includes(permission.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ @${commenter} 只有 **仓库维护者** (admin/write) 可以使用 \`/reject\` 命令。`
              });
              core.setFailed(`用户 @${commenter} 没有权限拒绝插件`);
              return;
            }
            
            // 解析拒绝原因
            const reasonMatch = commentBody.match(/^\/reject\s*([\s\S]*)/);
            let reason = reasonMatch && reasonMatch[1].trim();
            
            if (!reason) {
              reason = '未提供具体原因';
            }
            
            console.log(`@${commenter} 拒绝插件，原因: ${reason}`);
            
            // 添加拒绝评论
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🚫 插件被拒绝 / Plugin Rejected\n\n此插件提交已被维护者拒绝。\n\n| 信息 | 值 |\n|------|----|\n| 拒绝人 | @${commenter} |\n| 原因 | ${reason} |\n\n如有疑问，请联系仓库维护者。\n\n---\n\n*如果您已修改插件以符合要求，可以创建新的 Issue 重新提交。*`
            });
            
            // 移除验证相关标签，添加 rejected 标签
            const labelsToRemove = ['validated', 'validation-failed', 'pending-validation'];
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label
                });
              } catch (e) {
                // 标签不存在，忽略
              }
            }
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['rejected']
            });
            
            // 关闭 Issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
