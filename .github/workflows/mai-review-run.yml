name: Mai Review Runner

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      review_prompt:
        required: true
        type: string
      maimai_prompt:
        required: true
        type: string
      structured_release_review:
        default: false
        type: boolean
    outputs:
      review_ready:
        value: ${{ jobs.mai-review.outputs.review_ready }}
    secrets:
      MAI_REVIEW_APP_ID:
        required: true
      MAI_REVIEW_APP_PRIVATE_KEY:
        required: true
      STEP_API_KEY:
        required: true

jobs:
  mai-review:
    outputs:
      review_ready: ${{ steps.review-artifact.outputs.artifact-id != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: mai-review-issue-${{ inputs.issue_number }}
      cancel-in-progress: false
    env:
      REVIEW_ISSUE_NUMBER: ${{ inputs.issue_number }}
      STEP_BASE_URL: https://api.stepfun.com/step_plan
      STEP_MODEL: step-5-preview
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Create Mai GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAI_REVIEW_APP_ID }}
          private-key: ${{ secrets.MAI_REVIEW_APP_PRIVATE_KEY }}

      - name: Check reviewer permission
        id: check-permission
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const commenter = context.payload.comment.user.login;
            const command = context.payload.comment.body.trim();
            if (!['/mai_review', '/mr'].includes(command)) {
              core.setFailed('评论不是独立的 /mai_review 或 /mr 重审命令');
              return;
            }

            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter,
            });

            const allowedPermissions = ['admin', 'write'];
            if (!allowedPermissions.includes(permission.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.REVIEW_ISSUE_NUMBER),
                body: `⚠️ @${commenter} 只有 **仓库维护者** (admin/write) 可以使用 \`/mai_review\` 或 \`/mr\` 命令。`,
              });
              core.setFailed(`用户 @${commenter} 没有权限使用 ${command}`);
              return;
            }

            core.setOutput('commenter', commenter);

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Reserve review and announce start
        id: review-start
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { countReviews, MAX_REVIEWS } = require('./.github/scripts/mai_review_state.js');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: Number(process.env.REVIEW_ISSUE_NUMBER),
              per_page: 100,
            });
            const count = countReviews(comments);
            if (count >= MAX_REVIEWS) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: Number(process.env.REVIEW_ISSUE_NUMBER),
                body: `该 Issue 已达到审核次数上限，无法再次发起审核。\n\n已审核：${count}次 / ${MAX_REVIEWS}次`,
              });
              core.setOutput('should_run', 'false');
              return;
            }
            const reviewCount = count + 1;
            const reviewRun = `${context.runId}:${process.env.GITHUB_RUN_ATTEMPT}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.REVIEW_ISSUE_NUMBER),
              body: `<!-- codex-mai-review-start: ${reviewRun} -->\n🔄 已开始审核，正在检查当前插件版本，请等待审核结果。\n\n已审核：${reviewCount}次 / ${MAX_REVIEWS}次`,
            });
            core.setOutput('review_count', reviewCount);
            core.setOutput('review_run', reviewRun);
            core.setOutput('should_run', 'true');

      - name: Mark review in progress
        id: review-label
        if: steps.review-start.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: 'reviewing' });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ ...context.repo, name: 'reviewing', color: 'fbca04', description: '麦麦正在审核插件' });
            }
            await github.rest.issues.addLabels({ ...context.repo,
              issue_number: Number(process.env.REVIEW_ISSUE_NUMBER), labels: ['reviewing'] });

      - name: Setup Node.js
        if: steps.review-start.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Step API credentials
        if: steps.review-start.outputs.should_run == 'true'
        env:
          STEP_API_KEY: ${{ secrets.STEP_API_KEY }}
        run: |
          if [ -z "$STEP_API_KEY" ]; then
            echo "缺少 STEP_API_KEY secret" >&2
            exit 1
          fi

      - name: Build review context
        if: steps.review-start.outputs.should_run == 'true'
        id: build-context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node .github/scripts/build_mai_review_context.js

      - name: Checkout plugin under review
        if: steps.review-start.outputs.should_run == 'true' && steps.build-context.outputs.plugin_repo != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.build-context.outputs.plugin_repo }}
          ref: ${{ steps.build-context.outputs.latest_commit }}
          path: plugin-under-review
          persist-credentials: false

      - name: Checkout release batch and prepare changes
        if: steps.review-start.outputs.should_run == 'true' && steps.build-context.outputs.release_batch == 'true'
        run: node .github/scripts/checkout_release_reviews.cjs

      - name: Install Step Code CLI
        if: steps.review-start.outputs.should_run == 'true'
        timeout-minutes: 10
        run: |
          curl --fail --silent --show-error --location --http1.1 \
            --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors --retry-max-time 480 \
            https://static-openapi.stepfun.com/stepcode/0.1.4/step-0.1.4-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/step-code.tar.gz"
          echo "58f898db0e65f88c8fe5cd44622538ca8cb687bed38eb82821763c1c8478ccd7  $RUNNER_TEMP/step-code.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/step-code"
          tar -xzf "$RUNNER_TEMP/step-code.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/step-code"
          echo "$RUNNER_TEMP/step-code" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/step-code/step" --version

      - name: Run StepFun review
        if: steps.review-start.outputs.should_run == 'true'
        timeout-minutes: 30
        env:
          REVIEW_PROMPT: ${{ inputs.review_prompt }}
          STRUCTURED_RELEASE_REVIEW: ${{ inputs.structured_release_review }}
          STEP_API_KEY: ${{ secrets.STEP_API_KEY }}
        run: |
          MODE=text
          if [ "$STRUCTURED_RELEASE_REVIEW" = 'true' ]; then
            MODE=structured
          fi
          node .github/scripts/run_step_review.cjs "$REVIEW_PROMPT" codex-review.md step-review "$MODE"

      - name: Validate structured release review
        if: steps.review-start.outputs.should_run == 'true' && inputs.structured_release_review
        run: node .github/scripts/release_review_result.cjs

      - name: Run StepFun Mai comment
        if: steps.review-start.outputs.should_run == 'true'
        timeout-minutes: 10
        env:
          MAI_COMMENT_PROMPT: ${{ inputs.maimai_prompt }}
          STEP_API_KEY: ${{ secrets.STEP_API_KEY }}
        run: |
          node .github/scripts/run_step_review.cjs "$MAI_COMMENT_PROMPT" codex-maimai.md step-maimai

      # Refresh the App token before posting results, including failed reviews.
      # Long reviews may outlive the token used for the start notification.
      - name: Refresh Mai GitHub App token for result
        if: always() && steps.review-start.outputs.should_run == 'true'
        id: result-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAI_REVIEW_APP_ID }}
          private-key: ${{ secrets.MAI_REVIEW_APP_PRIVATE_KEY }}

      - name: Post review comment
        if: steps.review-start.outputs.should_run == 'true' && success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.result-app-token.outputs.token || steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const sanitize = (text) =>
              text
                .replace(/\/(?:approve|ap)\b/gi, '"approve"')
                .replace(/\/recheck\b/gi, '"recheck"')
                .replace(/\/(?:mai_review|mr)\b/gi, '"mai_review"')
                .replace(/\/reject\b/gi, '"reject"');

            const review = sanitize(fs.readFileSync('codex-review.md', 'utf8').trim());
            const maimai = sanitize(fs.readFileSync('codex-maimai.md', 'utf8').trim());
            if (!review) {
              core.setFailed('codex-review.md 为空，无法发表评论');
              return;
            }
            if (!maimai) {
              core.setFailed('codex-maimai.md 为空，无法发表评论');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.REVIEW_ISSUE_NUMBER),
              body: `<!-- codex-mai-review -->\n<!-- codex-mai-review-run: ${{ steps.review-start.outputs.review_run }} -->\n<!-- codex-mai-review-commit: ${{ steps.build-context.outputs.latest_commit }} -->\n${review}\n${maimai}\n\n已审核：${{ steps.review-start.outputs.review_count }}次 / 8次`,
            });

      - name: Save structured release review
        id: review-artifact
        if: steps.review-start.outputs.should_run == 'true' && inputs.structured_release_review && success()
        uses: actions/upload-artifact@v4
        with:
          name: release-review-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-review.json
            mai-release-targets.json
          if-no-files-found: error
          retention-days: 7

      - name: Save review diagnostics
        if: always() && steps.review-start.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-diagnostics-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codex-review.md
            codex-review-raw.md
            step-review-events.jsonl
            step-review-stderr.log
            step-review-attempt-*-events.jsonl
            step-review-attempt-*-stderr.log
            step-maimai-events.jsonl
            step-maimai-stderr.log
            step-maimai-attempt-*-events.jsonl
            step-maimai-attempt-*-stderr.log
            mai-review-input.md
            mai-release-targets.json
            codex-maimai.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Post review failure
        if: always() && steps.review-start.outputs.should_run == 'true' && (failure() || cancelled())
        uses: actions/github-script@v7
        env:
          REVIEW_COUNT: ${{ steps.review-start.outputs.review_count }}
          REVIEW_RUN: ${{ steps.review-start.outputs.review_run }}
        with:
          github-token: ${{ steps.result-app-token.outputs.token || steps.app-token.outputs.token }}
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.REVIEW_ISSUE_NUMBER),
              body: `<!-- codex-mai-review-failed: ${process.env.REVIEW_RUN} -->\n❌ 本次审核失败或被中止，未能完成审核。请维护者查看[运行日志](${runUrl})排查，修复后可重新请求审核。\n\n已审核：${process.env.REVIEW_COUNT}次 / 8次`,
            });

      - name: Clear review in progress
        if: always() && (steps.review-label.outcome == 'success' || steps.review-label.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.result-app-token.outputs.token || steps.app-token.outputs.token }}
          script: |
            try {
              await github.rest.issues.removeLabel({ ...context.repo,
                issue_number: Number(process.env.REVIEW_ISSUE_NUMBER), name: 'reviewing' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
